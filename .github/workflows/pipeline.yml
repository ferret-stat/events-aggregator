name: Events Aggregator Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read
  packages: write

jobs:
  # 1. CI: Lint and Tests
  tests:
    name: Lint and Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: events_aggregator_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d events_aggregator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/events_aggregator_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/events_aggregator_test
      EXTERNAL_API_URL: https://example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -v

  # 2. Build Docker image
  build:
    name: Build and Push Docker Image
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      repo: ${{ steps.repo.outputs.repo }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase repository name
        id: repo
        run: |
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.repo }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=main-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo }}:${{ github.sha }}
            ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Deploy to LMS
  deploy:
    name: Deploy to LMS
    needs: build
    runs-on: ubuntu-latest

    concurrency:
      group: lms-deploy-main
      cancel-in-progress: false

    steps:
      - name: Send deploy request
        env:
          LMS_API_KEY: ${{ secrets.LMS_API_KEY }}
          IMAGE: ghcr.io/${{ needs.build.outputs.repo }}:${{ github.sha }}
          REPOSITORY: ${{ github.repository }}

        run: |
          set -euo pipefail

          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${LMS_API_KEY}" \
            -d "{\"image\":\"${IMAGE}\",\"repository\":\"${REPOSITORY}\"}" \
            https://lms.python-labs.ru/api/deploy-requests)

          echo "HTTP status: ${HTTP_CODE}"
          cat response.txt

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Deployment request failed"
            exit 1
          fi

          echo "Deployment request sent successfully"
