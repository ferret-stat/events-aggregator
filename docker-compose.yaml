services:
  db:
    image: postgres:17
    container_name: events-aggregator-db
    environment:
      POSTGRES_DB: events_aggregator
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d events_aggregator"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: